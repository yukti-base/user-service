# Object storage (Cloudinary). Student documents are stored with PUBLIC,
# non-expiring delivery URLs by deliberate decision: documents are sent on to
# companies and HR who have no portal login, and an expiring link would leave a
# recruiter unable to open a resume at the moment it is needed. Accountability
# comes from document_access_logs, which records every URL handed out.
yuktisetu.storage.enabled=true
yuktisetu.storage.cloud-name=${CLOUDINARY_CLOUD_NAME:dedhzsghv}
yuktisetu.storage.api-key=${CLOUDINARY_API_KEY:738632164957489}
yuktisetu.storage.api-secret=${CLOUDINARY_API_SECRET:23N0CQcysxzL0OcI4EeZAbyP0a4}
yuktisetu.storage.root-folder=yuktisetu
yuktisetu.storage.max-file-size-bytes=10485760

# Multipart limits must be at least as large as the storage limit, or Tomcat
# rejects the request before the service can return a readable error.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
