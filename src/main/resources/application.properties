spring.application.name=user-service
server.servlet.context-path=/api/user
server.port=8083

# Kept deliberately. user-service is the only service that defaults to a
# profile, and removing it would make bootRun fail without an explicit flag --
# a behaviour change this pass is not supposed to make. A command-line
# --spring.profiles.active=dev still overrides this, since CLI args outrank
# properties files.
spring.profiles.active=local
