spring.application.name=user-service
server.port=8083
# Local PostgreSQL

spring.datasource.url=jdbc:postgresql://ep-sparkling-mouse-ayji4291-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_NGeLjF2YWKt1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# validate, not update: every service scans org.yuktisetu.db, so more than
# one service auto-creating the same tables concurrently is a race. Exactly
# one owner does DDL -- admin-service -- and it must be started first after
# any schema change.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

